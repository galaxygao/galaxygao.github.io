<section class="section research-section" id="research">
  <div class="container z-1">
    <div class="row justify-content-center txt-bg txt-bg-experiences">
      <div class="col-lg-6">
        <div class="section-title text-center mb-4 pb-2">
          <div class="mb-5 pb-3">
            <i class="fas fa-flask h1 text-muted"></i>
          </div>
          <h2 class="h3 font-weight-bold">Research Experience</h2>
          <p class="text-muted mx-auto mb-0 mt-4 para-desc">
            Computational fluid mechanics, machine learning, and mechanics research.
          </p>
        </div>
      </div>
    </div>

    <div class="research-list">
      <article *ngFor="let experience of experiencesData"
        class="research-card wow fadeIn{{experience['animationClass']}}">
        <div class="research-heading">
          <div>
            <h3>{{ experience['title'] }}</h3>
            <p class="research-role">{{ experience['role'] }} · {{ experience['organization'] }}</p>
          </div>
          <span class="research-period">{{ experience['period'] }}</span>
        </div>
        <ul>
          <li *ngFor="let bullet of experience['bullets']">{{ bullet }}</li>
        </ul>
      </article>
    </div>
  </div>
</section>
