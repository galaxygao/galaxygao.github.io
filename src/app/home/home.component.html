<section class="bg-home" id="home">
  <div class="bg-overlay"></div>
  <div id="particles-js"></div>
  <div class="home-center">
    <div class="home-desc-center">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-10 mt-5">
            <div class="home-title text-center">
              <div class="wow fadeInDownBig text-white-50 mb-3 font-weight-normal h5" data-wow-delay="0.5s">
                
              </div>
              <h2 class="display-3">
                <div id="typed-strings">
                  <p *ngFor="let typedElement of homeData['typedElement']">
                    {{typedElement}}
                  </p>
                </div>
                <span id="element" class="text-white"></span>
              </h2>
              <h3 class="wow fadeInUpBig text-light mx-auto para-desc" data-wow-delay="0.5s">
                {{language.pick(homeData['introduction'], homeData['introductionZh'])}}
              </h3>
            </div>
          </div>
          <div class="mt-4 pt-2">
            <ng-template #title>
              <strong><em>{{language.pick('Resume', '简历')}}</em></strong>
            </ng-template>
            <div class="resume-button" placement="bottom" [ngbTooltip]="title">
              <a rel="noreferrer" [attr.aria-label]="language.pick('View resume (opens in a new tab)', '查看简历（在新标签页打开）')" target="_blank" [href]="homeData['resumeLink']">
                {{language.pick('View Resume', '查看简历')}} <i class="fas fa-external-link-alt ml-2"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
