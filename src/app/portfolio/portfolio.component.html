<section class="section portfolio-section" id="portfolio">
  <div class="container">
    <div class="portfolio-heading wow fadeIn">
      <div>
        <span class="section-kicker">Selected work</span>
        <h2>Research portfolio</h2>
      </div>
      <p>
        Computational fluid mechanics, scientific machine learning, and
        mechanics projects developed across research and coursework.
      </p>
    </div>

    <div class="portfolio-grid">
      <article
        *ngFor="let project of portfolioData; let index = index"
        class="project-card wow {{ project['animationClass'] }}"
        [attr.data-wow-delay]="project['delay']"
      >
        <a
          class="project-card-link"
          [routerLink]="['/projects']"
          [queryParams]="{ project: project['slug'] }"
          [attr.aria-label]="'View project: ' + project['project']"
        >
          <div class="project-media">
            <img
              *ngIf="project['image'] || project['imagePath']"
              [src]="project['imagePath'] || 'assets/images/portfolio/' + project['image']"
              [alt]="project['project']"
              loading="lazy"
              decoding="async"
            />
            <div
              *ngIf="!project['image'] && !project['imagePath']"
              class="project-placeholder"
              aria-hidden="true"
            >
              <i class="{{ project['icon'] }}"></i>
            </div>
            <span class="project-index">0{{ index + 1 }}</span>
          </div>

          <div class="project-copy">
            <span class="project-category">{{ project['category'] }}</span>
            <h3>{{ project['project'] }}</h3>
            <p>{{ project['description'] }}</p>
            <span class="project-action">
              Explore project <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </span>
          </div>
        </a>
      </article>
    </div>
  </div>
</section>
